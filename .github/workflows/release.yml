name: Package GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches addon version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release.py --tag "$RELEASE_TAG"

      - name: Package and publish GitHub release
        uses: BigWigsMods/packager@v2
        with:
          args: '-n "ClassicQuestboard-{project-version}"'
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
